<h2 id="retomada--o-que-voc%C3%AA-fez-em-casa">Retomada — o que você fez em casa</h2>
<div class="dica">🔄 A aula começa consolidando a entrega da Aula 3.</div>
<ul>
<li>Você escreveu o <strong><code>carga.py</code></strong> e disparou <strong>N clientes</strong> contra o servidor multicliente?</li>
<li>O <strong><code>relatorio_concorrencia.md</code></strong> mostrou <strong>onde o single-thread trava</strong> conforme a carga cresce?</li>
<li>Confirmou que <strong>uma thread por cliente</strong> aguenta muito mais que o servidor sequencial?</li>
</ul>
<div class="aviso">📌 Até aqui você trocou <strong>bytes crus</strong> no socket. Hoje vamos fazer uma função em <strong>outra máquina</strong> parecer uma <strong>chamada local</strong>.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="objetivos-desta-aula">Objetivos desta aula</h2>
<p>Ao final, você será capaz de:</p>
<ol>
<li><strong>Explicar</strong> a ideia de <strong>chamada remota de procedimento (RPC)</strong>.</li>
<li><strong>Escrever</strong> um contrato <strong><code>.proto</code></strong> com Protocol Buffers.</li>
<li><strong>Implementar</strong> um <strong>servidor</strong> e um <strong>cliente gRPC</strong> em Python.</li>
</ol>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="conceito-13--a-ideia-do-rpc">Conceito 1/3 — A ideia do RPC</h2>
<ul>
<li><strong>RPC</strong> (<em>Remote Procedure Call</em>) nasceu de um desejo simples: fazer uma função que está em <strong>outra máquina</strong> parecer uma <strong>função local</strong>.</li>
<li>Em vez de escrever bytes no socket e interpretá-los na mão, você chama <code>servico.somar(2, 3)</code> — e o <strong>middleware</strong> (a camada entre a sua aplicação e a rede) <strong>empacota</strong> os argumentos, envia, recebe o resultado e devolve.</li>
<li>Linha do tempo: <strong>RPC clássico → CORBA → RMI</strong> (Invocação de Métodos Remotos do Java) <strong>→ gRPC</strong> (hoje).</li>
</ul>
<div class="dica">💡 É <strong>transparência de acesso</strong> em ação (Aula 1): usar o remoto <strong>como se fosse local</strong>. A ementa fala de <strong>RPC e RMI</strong> — tratamos ambos como a origem do gRPC.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="a-chamada-remota-passo-a-passo">A chamada remota, passo a passo</h2>
<svg viewBox="0 0 880 320" role="img" style="width:100%;max-width:880px;display:block;margin:6px auto 0;font-family:'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="rq" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#12437f" /></marker>

<h2 id="conceito-23--o-contrato-proto-protocol-buffers">Conceito 2/3 — O contrato: <code>.proto</code> (Protocol Buffers)</h2>
<ul>
<li>Para trafegar na rede, uma estrutura vira <strong>sequência de bytes</strong> e é remontada do outro lado — isso é a <strong>serialização</strong>.</li>
<li>No gRPC, o <strong>formato</strong> e o <strong>contrato</strong> do serviço ficam num arquivo <strong><code>.proto</code></strong> (<strong>Protocol Buffers</strong>): você declara <strong>quais operações</strong> o serviço oferece e <strong>quais mensagens</strong> trafegam (campos e tipos).</li>
<li>Uma ferramenta lê o <code>.proto</code> e <strong>gera o código</strong> de cliente e servidor — os <strong>stubs</strong>, que escondem a rede e fazem a chamada remota <strong>parecer local</strong>.</li>
</ul>
<div class="aviso">⚠️ A inversão importante: <strong>o contrato existe ANTES do código</strong>, e os dois lados são <strong>obrigados a respeitá-lo</strong>. Muda o contrato → regera os stubs → os dois lados se atualizam.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>

<h2 id="serializa%C3%A7%C3%A3o--e-por-que-o-bin%C3%A1rio-%C3%A9-menor">Serialização — e por que o binário é menor</h2>
<svg viewBox="0 0 860 300" role="img" style="width:100%;max-width:840px;display:block;margin:6px auto 0;font-family:'Segoe UI',Arial,sans-serif">

  <text x="30" y="140" fill="#0d2b57" font-size="14" font-weight="700">Os mesmos dados, dois tamanhos:</text>

<h2 id="conceito-33--por-que-grpc-%C3%A9-usado-hoje">Conceito 3/3 — Por que gRPC é usado hoje</h2>
<div class="cols">
<div>
<p><strong>Três motivos</strong></p>
<ol>
<li><strong>Binário compacto</strong> — o Protocol Buffers trafega <strong>muito menos bytes</strong> que JSON/XML.</li>
<li><strong>HTTP/2</strong> — várias chamadas na <strong>mesma conexão</strong>, sem reabrir a cada pedido.</li>
<li><strong>Contrato tipado</strong> — erros de tipo aparecem <strong>cedo</strong> (na geração dos stubs), não em produção.</li>
</ol>
</div>
<div>
<p><strong>Onde usar</strong></p>
<ul>
<li><strong>Interno</strong> (serviço <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> serviço, microsserviços de IA): <strong>gRPC</strong> vence.</li>
<li><strong>Externo</strong> (público consumindo): <strong>REST</strong> costuma vencer pela <strong>simplicidade</strong> — é a <strong>próxima aula</strong>.</li>
</ul>
</div>
</div>
<div class="dica">💡 Guarde: <strong>gRPC para dentro</strong>, <strong>REST para fora</strong>. Seu serviço de IA vai ter as duas interfaces.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>

<h1 id="laborat%C3%B3rio">Laboratório</h1>
<h3 id="seu-primeiro-servi%C3%A7o-grpc--passo-a-passo">Seu primeiro serviço gRPC — passo a passo</h3>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="lab--passo-1--o-contrato-servicoproto">Lab · Passo 1 — o contrato <code>servico.proto</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-proto">syntax = <span class="hljs-string">&quot;proto3&quot;</span>;

<span class="hljs-keyword">package</span> calculadora;

<span class="hljs-keyword">service </span><span class="hljs-title class_">Calculadora</span> {
  <span class="hljs-function"><span class="hljs-keyword">rpc</span> Somar (Operandos) <span class="hljs-keyword">returns</span> (Resultado)</span>;   <span class="hljs-comment">// a operação remota</span>
}

<span class="hljs-keyword">message </span><span class="hljs-title class_">Operandos</span> {        <span class="hljs-comment">// o que o cliente ENVIA</span>
  <span class="hljs-type">int32</span> a = <span class="hljs-number">1</span>;             <span class="hljs-comment">// o &quot;= 1&quot; é a posição do campo no formato binário</span>
  <span class="hljs-type">int32</span> b = <span class="hljs-number">2</span>;
}

<span class="hljs-keyword">message </span><span class="hljs-title class_">Resultado</span> {        <span class="hljs-comment">// o que o servidor DEVOLVE</span>
  <span class="hljs-type">int32</span> valor = <span class="hljs-number">1</span>;
}
</code></pre>
<div class="dica">💡 Isto é <strong>só o contrato</strong> — nenhuma lógica ainda. Os números (<code>= 1</code>, <code>= 2</code>) identificam o campo nos bytes, <strong>não</strong> são valores.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="lab--passo-2--gerar-os-stubs">Lab · Passo 2 — gerar os stubs</h2>
<p>No terminal, na pasta do <code>.proto</code>, rode o <strong>protoc</strong> (vem no <code>grpcio-tools</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell">pip install grpcio grpcio<span class="hljs-literal">-tools</span>
python <span class="hljs-literal">-m</span> grpc_tools.protoc <span class="hljs-literal">-I</span>. <span class="hljs-literal">--python_out</span>=. <span class="hljs-literal">--grpc_python_out</span>=. servico.proto
</code></pre>
<p>Isso <strong>gera dois arquivos</strong> (não edite!):</p>
<ul>
<li><strong><code>servico_pb2.py</code></strong> — as mensagens (<code>Operandos</code>, <code>Resultado</code>).</li>
<li><strong><code>servico_pb2_grpc.py</code></strong> — os <strong>stubs</strong> de cliente e servidor.</li>
</ul>
<div class="aviso">⚠️ Toda vez que você <strong>mudar o <code>.proto</code></strong>, rode este comando de novo para <strong>regerar</strong> os stubs. É o contrato mandando no código.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="lab--passo-3--servidor_grpcpy">Lab · Passo 3 — <code>servidor_grpc.py</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> grpc
<span class="hljs-keyword">from</span> concurrent <span class="hljs-keyword">import</span> futures
<span class="hljs-keyword">import</span> servico_pb2, servico_pb2_grpc

<span class="hljs-keyword">class</span> <span class="hljs-title class_">CalculadoraServicer</span>(servico_pb2_grpc.CalculadoraServicer):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">Somar</span>(<span class="hljs-params">self, request, context</span>):           <span class="hljs-comment"># implementa a operação</span>
        <span class="hljs-keyword">return</span> servico_pb2.Resultado(valor=request.a + request.b)

servidor = grpc.server(futures.ThreadPoolExecutor(max_workers=<span class="hljs-number">10</span>))  <span class="hljs-comment"># threads da Aula 3!</span>
servico_pb2_grpc.add_CalculadoraServicer_to_server(CalculadoraServicer(), servidor)
servidor.add_insecure_port(<span class="hljs-string">&quot;127.0.0.1:50051&quot;</span>)
servidor.start()
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;[servidor gRPC] ouvindo em 127.0.0.1:50051&quot;</span>, flush=<span class="hljs-literal">True</span>)
servidor.wait_for_termination()
</code></pre>
<div class="dica">💡 Repare no <code>ThreadPoolExecutor</code>: o gRPC atende vários clientes com o <strong>pool de threads</strong> que você estudou na Aula 3.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="lab--passo-4--cliente_grpcpy-e-rodar">Lab · Passo 4 — <code>cliente_grpc.py</code> e rodar</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> grpc
<span class="hljs-keyword">import</span> servico_pb2, servico_pb2_grpc

<span class="hljs-keyword">with</span> grpc.insecure_channel(<span class="hljs-string">&quot;127.0.0.1:50051&quot;</span>) <span class="hljs-keyword">as</span> canal:
    stub = servico_pb2_grpc.CalculadoraStub(canal)
    resposta = stub.Somar(servico_pb2.Operandos(a=<span class="hljs-number">2</span>, b=<span class="hljs-number">3</span>))   <span class="hljs-comment"># parece local!</span>
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;2 + 3 =&quot;</span>, resposta.valor)
</code></pre>
<p><strong>Dois terminais:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell">python servidor_grpc.py     <span class="hljs-comment"># Terminal 1 → ouvindo em 50051</span>
python cliente_grpc.py      <span class="hljs-comment"># Terminal 2 → 2 + 3 = 5</span>
</code></pre>
<div class="dica">💡 <code>stub.Somar(...)</code> é uma <strong>chamada de rede</strong> disfarçada de chamada de função. O middleware do gRPC cuidou de tudo.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="lab--checkpoints--problemas-comuns-windows">Lab · Checkpoints &amp; problemas comuns (Windows)</h2>
<div class="cols">
<div>
<p><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> O que você deve ver</strong></p>
<ul>
<li><code>protoc</code> cria <code>servico_pb2.py</code> e <code>servico_pb2_grpc.py</code>.</li>
<li>Servidor: <code>ouvindo em 127.0.0.1:50051</code>.</li>
<li>Cliente: <code>2 + 3 = 5</code>.</li>
</ul>
</div>
<div>
<p><strong><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Se der erro</strong></p>
<ul>
<li><code>ModuleNotFoundError: servico_pb2</code> → você não gerou os stubs (Passo 2) ou está em outra pasta.</li>
<li><code>No module named grpc</code> → falta <code>pip install grpcio grpcio-tools</code>.</li>
<li>Porta ocupada → troque <code>50051</code> por outra.</li>
<li>Mudou o <code>.proto</code> e nada mudou? <strong>Regere os stubs.</strong></li>
</ul>
</div>
</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">

<h2 id="atividade-para-casa--ampliar-o-contrato">Atividade para casa — ampliar o contrato</h2>
<ol>
<li><strong>Adicione um segundo método</strong> ao <code>servico.proto</code> — por exemplo <code>Multiplicar (Operandos) returns (Resultado)</code>.</li>
<li><strong>Regere os stubs</strong> (Passo 2) e <strong>implemente</strong> o novo método no servidor.</li>
<li><strong>Chame os dois</strong> métodos pelo cliente e confira os resultados.</li>
<li><strong>Escreva um <code>README.md</code></strong> explicando <strong>o que acontece se você mudar o contrato</strong> (renomear um campo, trocar um tipo): por que os <strong>dois lados</strong> precisam regerar os stubs.</li>
</ol>
<div class="aviso">📌 <strong>Entregar até a próxima aula:</strong> serviço gRPC com <strong>2 métodos</strong> + <code>README</code> sobre o <strong>impacto de mudar o contrato</strong>.</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="%E2%97%86-foco-enade">◆ Foco ENADE</h2>
<p><strong>O que costuma cair:</strong></p>
<ul>
<li>Conceito de <strong>RPC</strong> e <strong>transparência de acesso</strong>.</li>
<li><strong>RMI</strong> e invocação de métodos remotos.</li>
<li><strong>Serialização</strong> e representação de dados na rede.</li>
<li><strong>Middleware</strong> de comunicação e <strong>stubs</strong>.</li>
</ul>
<p><strong>Termos-chave:</strong> RPC · RMI · gRPC · Protocol Buffers · Stub · Serialização · Middleware</p>
<div class="dica">💡 A serialização (converter estruturas em bytes) costuma aparecer junto, assim como a comparação <strong>gRPC × outras formas de integração</strong> (REST, mensageria).</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="quest%C3%A3o-de-autoavalia%C3%A7%C3%A3o-estilo-enade">Questão de autoavaliação (estilo ENADE)</h2>
<p>No gRPC, qual é a função do arquivo com extensão <strong><code>.proto</code></strong>?</p>
<p>A) Conter a <strong>implementação completa</strong> do servidor.<br />
B) <strong>Definir o contrato</strong> (mensagens e operações), a partir do qual se <strong>geram os stubs</strong>.<br />
C) Ser <strong>gerado automaticamente</strong> após a implementação do servidor.<br />
D) <strong>Eliminar</strong> a necessidade de comunicação em rede.<br />
E) Armazenar as <strong>credenciais</strong> de autenticação do serviço.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="resolu%C3%A7%C3%A3o--alternativa-b">Resolução — alternativa <strong>B</strong></h2>
<ul>
<li>O <code>.proto</code> é o <strong>contrato</strong> e vem <strong>antes</strong> do código; a ferramenta <strong>gera</strong>, a partir dele, os <strong>stubs</strong> de cliente e de servidor.</li>
<li><strong>C</strong> inverte a ordem (o <code>.proto</code> não é gerado — ele <strong>é a origem</strong>).</li>
<li><strong>A</strong>, <strong>D</strong> e <strong>E</strong> descrevem coisas que o <code>.proto</code> <strong>não</strong> faz (implementação, eliminar a rede, credenciais).</li>
</ul>
<div class="dica">💡 É o seu <code>servico.proto</code> de hoje virando questão de prova.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · <a href="../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html)" data-theme="uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Sistemas Distribuídos e Computação em Nuvem · 2026/2 · [☰ Sumário](../index.html);--theme:uy59r17x23aun64xiduvdlob74lja6bfhc7jvamuiy;" data-marpit-pagination-total="24">
<h2 id="fora-da-sala--gloss%C3%A1rio">Fora da sala · Glossário</h2>
<div class="cols">
<div>
<p><strong>Para estudar</strong></p>
<ul>
<li><strong>Coulouris</strong>, cap. 5 — Invocação remota (RPC/RMI).</li>
<li>Documentação oficial do <strong>gRPC</strong> (Python) e do <strong>Protocol Buffers</strong>.</li>
<li>Abra o <code>proto/</code> do <strong>kit da C1</strong> e leia o contrato já pronto.</li>
</ul>
</div>
<div>
<p><strong>Glossário</strong></p>
<ul>
<li><strong>RPC:</strong> invocar uma função que está em outra máquina.</li>
<li><strong>gRPC:</strong> RPC atual, binário, sobre HTTP/2, contrato em <code>.proto</code>.</li>
<li><strong>Protocol Buffers:</strong> formato binário que define o contrato.</li>
<li><strong>Stub:</strong> código gerado que representa o serviço remoto.</li>
<li><strong>Middleware:</strong> camada que cuida da comunicação distribuída.</li>
</ul>
</div>
</div>
